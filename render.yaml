# Render Blueprint: API + Postgres + shopper/lender/affiliate web + admin back office.
# Deploy: render.com → New → Blueprint → pick this repo. See DEPLOY.md for the values to enter.
databases:
  - name: xtra-cash-db
    plan: free
    region: frankfurt
    databaseName: xtracash
    user: xtracash
    postgresMajorVersion: "16"

services:
  - type: web
    name: xtra-cash-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install -g pnpm@10.18.0 && pnpm install --frozen-lockfile --prod=false && pnpm --filter @xtra/api build
    # Applies migrations and creates the first super-admin (if missing) before starting.
    startCommand: cd apps/api && node dist/db/migrate.js && node dist/db/create-admin.js && node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: xtra-cash-db
          property: connectionString
      - key: DB_POOL_SIZE
        value: "5"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: REFRESH_TTL_DAYS
        value: "30"
      - key: CARD_NETWORK_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      # Demo mode: allows "simulate purchase" and mock top-ups, since no card processor is connected yet.
      # Set to "false" before handling real money.
      - key: ENABLE_SIMULATION
        value: "true"
      # Browsers reach the API through the web/admin sites' /api proxy, so CORS only matters for other
      # browser clients. Optional: comma-separated origins to allow; empty allows any.
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_URL
        sync: false
      # First super-admin login (password: 12+ characters). Created once, on first start.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: xtra-cash-web
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install -g pnpm@10.18.0 && pnpm install --frozen-lockfile --prod=false && pnpm --filter @xtra/web build
    startCommand: cd apps/web && node ../../node_modules/next/dist/bin/next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The API's public URL, e.g. https://xtra-cash-api.onrender.com. Read at runtime by the /api proxy,
      # so changing it only needs a restart.
      - key: API_URL
        sync: false
      # Link to the back office on the login page. Baked in at build time.
      - key: NEXT_PUBLIC_ADMIN_URL
        sync: false

  - type: web
    name: xtra-cash-admin
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install -g pnpm@10.18.0 && pnpm install --frozen-lockfile --prod=false && pnpm --filter @xtra/admin build
    startCommand: cd apps/admin && node ../../node_modules/next/dist/bin/next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The API's public URL, e.g. https://xtra-cash-api.onrender.com (read at runtime by the /api proxy).
      - key: API_URL
        sync: false
