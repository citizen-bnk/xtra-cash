<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1640">
<title>Offline · XTRA-CASH</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 24px) 24px calc(env(safe-area-inset-bottom, 0px) + 24px);
    background: #2a1640; color: #fff; text-align: center;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .brand img { display: block; width: 240px; max-width: 100%; height: auto; }
  .icon { margin-top: 40px; width: 64px; height: 64px; border-radius: 18px; background: rgba(255,255,255,.1); display: grid; place-items: center; }
  h1 { margin: 24px 0 8px; font-size: 26px; font-weight: 900; }
  p { margin: 0; max-width: 300px; font-size: 15px; line-height: 1.5; color: rgba(255,255,255,.72); }
  button {
    margin-top: 32px; height: 48px; padding: 0 24px; border: 0; border-radius: 16px; background: #fb9320; color: #2a1640;
    font: inherit; font-weight: 600; font-size: 16px; cursor: pointer; transition: transform .12s ease;
  }
  button:active { transform: scale(.97); }
</style>
</head>
<body>
  <div class="brand"><img src="/brand/lockup-white.png" width="1920" height="420" alt="XTRA-CASH"></div>
  <div class="icon" aria-hidden="true">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fb9320" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><path d="m2 2 20 20"/></svg>
  </div>
  <h1>You’re offline</h1>
  <p>XTRA-CASH needs a connection to show your balance and approve payments. Check your data or Wi-Fi and try again.</p>
  <button onclick="location.reload()">Try again</button>
  <script>addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
